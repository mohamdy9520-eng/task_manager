name: task_manager_app
description: A modern task management app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management
  flutter_riverpod: ^2.4.9

  # Firebase
  firebase_core: ^3.4.1
  firebase_auth: ^5.1.0



  # UI Utilities
  google_fonts: ^6.1.0
  flutter_svg: ^2.2.4
  intl: ^0.19.0
  table_calendar: ^3.1.3
  smooth_page_indicator: ^2.0.1
  dio: ^5.9.2
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.0
  gestures: ^1.0.0
  flutter_facebook_auth: ^7.1.6
  flutter_bloc: ^9.1.1
  lottie: ^3.3.3
  flutter_native_splash: ^2.4.7
  image_picker: ^1.2.2
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/icons/icons8-google.svg
    - assets/images/icons/icons8-facebook96.svg
    - assets/images/pictures/vecteezy_man-entering-security-password_4689193.svg
    - assets/lottie/Sandy Loading.json

flutter_native_splash:
  color: "#ffffff"
  lottie: assets/lottie/Sandy Loading.json
  android: true
  ios: true
  fullscreen: true